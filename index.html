<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UPSC Tracker</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="setup-box">
    <div class="setup-title">UPSC Tracker</div>
    <div class="setup-sub">Enter your details to get started</div>
    <label class="setup-label">Your Name</label>
    <input class="setup-input" id="setup-name" type="text" placeholder="Name"/>
    <label class="setup-label">GitHub Token</label>
    <input class="setup-input" id="setup-token" type="password" placeholder="ghp_xxxxxxxxxxxx"/>
    <div class="setup-note">Token needs <b>repo</b> scope. Stored only in your browser. Syncs to <b>NaniChennuri/study-tracker → tracker-data.json</b></div>
    <button class="setup-btn" onclick="completeSetup()">Get Started</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none">

  <div id="topbar">
    <div class="tb-brand" onclick="navigateHome()">UPSC Tracker</div>
    <div class="tb-ca">
      <span class="tb-ca-lbl">Current Affairs</span>
      <button class="ca-btn" id="ca-today-btn" onclick="toggleCAToday()">○</button>
    </div>
    <div class="tb-right">
      <span class="tb-days" id="tb-days"></span>
      <button class="btn-save" onclick="saveAll()">Save</button>
    </div>
  </div>

  <div id="layout">
    <nav id="sidebar"></nav>
    <main id="main"></main>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
